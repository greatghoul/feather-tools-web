{% set tool_logo = tool_config(tool).get('logo') %}
<div class="card card-tool h-100 position-relative overflow-hidden">
    {% if tool_logo %}
        <img src="{{ url_for('static', filename=tool_logo) }}"
             alt=""
             aria-hidden="true"
             class="position-absolute top-50 end-0 translate-middle-y"
             style="height: 100%; opacity: 0.12; pointer-events: none;">
    {% endif %}
    <div class="card-body py-2 px-3 position-relative z-1">
        <h2 class="h6 card-title mb-1">
            <a href="{{ url_for('main.tool_home', tool=tool, lang=request.args.get('lang')) }}" class="stretched-link"
                title="{{ _(tool + '/note') }}">{{ _(tool + '/name') }}</a>
        </h2>
        <p class="card-text card-text-clamp mb-0">{{ _(tool + '/note') }}</p>
    </div>
</div>
