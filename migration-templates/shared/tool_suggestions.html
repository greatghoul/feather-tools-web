{% if suggested_tools %}
    <h2 class="h5 mb-3">{{ _('tool/you_may_also_like') }}</h2>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3 mb-3">
        {% for tool_name in suggested_tools %}
        <div class="col">
            {% set tool = tool_name %}
            {% include 'shared/tool_card.html' %}
        </div>
        {% endfor %}
    </div>
{% endif %}
